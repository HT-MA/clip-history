<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
  <title>ClipHistory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar" id="titlebar">
    <div class="titlebar-left">
      <svg class="app-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span class="app-title">ClipHistory</span>
      <span class="status-dot" id="statusDot"></span>
    </div>
    <div class="titlebar-right">
      <button class="title-btn" id="btnImport" title="Import">&#x21E9;</button>
      <button class="title-btn" id="btnExport" title="Export">&#x21E7;</button>
      <button class="title-btn" id="btnMinimize" title="Minimize">&#8211;</button>
      <button class="title-btn" id="btnHide" title="Hide (Esc)">&times;</button>
    </div>
  </div>

  <div class="search-box">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#86868b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" id="searchInput" placeholder="Search clipboard history..." autofocus>
    <span class="search-hint" id="searchHint"></span>
  </div>

  <div class="items-list" id="itemsList">
    <div class="empty-state" id="emptyState">
      <svg class="empty-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#c7c7cc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <div class="empty-text">No records yet</div>
      <div class="empty-sub">Copy something and it will appear here</div>
    </div>
  </div>

  <div class="footer">
    <span class="footer-count" id="footerCount">0 items</span>
    <div class="footer-right">
      <span class="footer-action" id="btnPause">Pause</span>
      <span class="footer-action" id="btnClear">Clear All</span>
    </div>
  </div>

  <!-- Context Menu -->
  <div class="context-menu" id="ctxMenu">
    <div class="context-menu-item" id="ctxCopy">&#x1F4CB; Copy</div>
    <div class="context-menu-item" id="ctxPaste">&#x1F4C4; Paste to active window</div>
    <div class="context-menu-item" id="ctxFavorite">&#x2B50; Toggle star</div>
    <div class="context-menu-sep"></div>
    <div class="context-menu-item danger" id="ctxDelete">&#x1F5D1; Delete</div>
  </div>

  <!-- Confirm Dialog -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div class="confirm-msg" id="confirmMsg"></div>
      <div class="confirm-buttons">
        <button class="confirm-btn cancel" id="confirmCancel">Cancel</button>
        <button class="confirm-btn danger" id="confirmOk">Clear</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">Copied</div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Detail</span>
        <button class="modal-close" id="modalClose">&#10005;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <span class="modal-time" id="modalTime"></span>
        <button class="modal-copy-btn" id="modalCopy">Copy</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
